[project]
name = "aito-company-ai"
version = "0.1.0"
description = "A one-person company's sales agent whose intuition is a predictive database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "mcp>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
company-ai = "company_ai.cli:main"
company-ai-mcp = "company_ai.server:main"

[dependency-groups]
dev = [
    "booktest>=0.5",
    "ruff>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
